name = "dysphagia-kb-review"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false
[triggers]
crons = ["*/15 * * * *"]
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true
[vars]
GITHUB_BRANCH = "main"
SCREENING_CHAPTER = "dysphagia"
ACCESS_TEAM_DOMAIN = "sparkling-bird-a757"
# Dedicated Dysphagia Access application e08897e1-8b7c-4699-a0e2-b3975b9e981d.
ACCESS_AUD = "4531402a8aaa6e843eef716ef92e8eaf5f24dd65982b273dec1771444b18690a"
[[r2_buckets]]
binding = "PRIVATE"
bucket_name = "dysphagia-kb-private"
[[d1_databases]]
binding = "SCREENING"
database_name = "dysphagia-screening-staging"
database_id = "2a696351-21cc-4563-81ae-a64ba3d50702"
[[routes]]
pattern = "review.dysphagia-kb.app"
custom_domain = true
