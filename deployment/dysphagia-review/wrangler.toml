name = "dysphagia-kb-review"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = true
[vars]
GITHUB_BRANCH = "main"
SCREENING_CHAPTER = "dysphagia"
ACCESS_TEAM_DOMAIN = "sparkling-bird-a757"
# Set to the dedicated Dysphagia Access application's audience before enabling sign-in.
ACCESS_AUD = ""
[[r2_buckets]]
binding = "PRIVATE"
bucket_name = "dysphagia-kb-private"
[[d1_databases]]
binding = "SCREENING"
database_name = "dysphagia-screening-staging"
database_id = "2a696351-21cc-4563-81ae-a64ba3d50702"
[[routes]]
pattern = "review.dysphagia-kb.app"
custom_domain = true
