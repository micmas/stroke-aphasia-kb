name: practice-review
on:
  push:
    branches: [main]
    paths:
      - 'deployment/practice-review/**'
      - 'portal/lib/open-access.js'
      - 'portal/web/open-access.js'
      - 'staging/dysphagia/functions/**'
      - 'staging/practice/web/**'
      - 'scripts/build_practice.py'
      - 'explorer/project-shell.*'
      - '.github/workflows/practice-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: practice-review
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: portal
      - run: node --test deployment/practice-review/worker.test.js
      - run: python3 scripts/build_practice.py
      - run: portal/node_modules/.bin/wrangler deploy --config deployment/practice-review/wrangler.toml
