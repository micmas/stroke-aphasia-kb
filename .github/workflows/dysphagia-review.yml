name: dysphagia-review
on:
  push:
    branches: [main]
    paths:
      - 'deployment/dysphagia-review/**'
      - 'portal/lib/open-access.js'
      - 'portal/web/**'
      - 'explorer/styles.css'
      - 'explorer/load-export.js'
      - 'staging/dysphagia/schema.sql'
      - 'staging/dysphagia/functions/**'
      - 'staging/dysphagia/web/**'
      - 'scripts/build_dysphagia_review.py'
      - 'explorer/project-shell.*'
      - '.github/workflows/dysphagia-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dysphagia-review
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: portal
      - run: portal/node_modules/.bin/wrangler d1 execute dysphagia-screening-staging --remote --file staging/dysphagia/schema.sql --config deployment/dysphagia-review/wrangler.toml
      - run: python3 scripts/build_dysphagia_review.py
      - run: portal/node_modules/.bin/wrangler deploy --config deployment/dysphagia-review/wrangler.toml
