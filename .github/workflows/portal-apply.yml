name: portal-apply

# Applies what reviewers sent through the review portal: runs portal_import.py on
# logs/portal/inbox/ (screening decisions into the register, verdicts/edits/marks/comments
# into the drafts, promote.py for approvers' verdicts), commits under the reviewers' names
# and pushes. `main` is a protected branch (pull request + status checks, which the
# maintainer may bypass), so the push is made with the maintainer's fine-grained token
# (secret PORTAL_PUSH_TOKEN: this repository, Contents read and write), not with the
# workflow's own GITHUB_TOKEN, which the protection refuses. A push made with that token
# starts explorer-pages, review-portal and test like any other push, so both sites rebuild.
# Papers included at full text get their citation keys here (screen.py register). Uploaded
# PDFs (`pdf` records) and extraction are left for the maintainer, who has the papers folder:
# extract-notice.yml emails her the command (scripts/extract_ready.py --execute).
#
# Started by the portal's "Apply now" button (functions/api/apply.js, maintainers only),
# by hand from the Actions tab, or every six hours when the inbox is not empty.
on:
  workflow_dispatch:
    inputs:
      requested_by:
        description: who pressed Apply
        required: false
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: portal-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: The push token is configured
        env:
          PUSH_TOKEN: ${{ secrets.PORTAL_PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::secret PORTAL_PUSH_TOKEN is missing (Settings → Secrets and variables → Actions): a fine-grained token for this repository with Contents read and write"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PORTAL_PUSH_TOKEN }}
      - name: Anything to apply?
        id: inbox
        run: |
          n=$(ls logs/portal/inbox/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "$n record(s) in the inbox"
      - uses: actions/setup-python@v5
        if: steps.inbox.outputs.count != '0'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
        if: steps.inbox.outputs.count != '0'
      - name: Apply the inbox
        if: steps.inbox.outputs.count != '0'
        run: python3 scripts/portal_import.py --execute --promote --skip-pdf
      - name: Citation keys for papers included at full text
        # Crossref lookups (screen.py register); renaming PDFs is left to the maintainer's
        # extract_ready.py, which has the papers folder. extract-notice.yml then emails her.
        if: steps.inbox.outputs.count != '0'
        run: python3 scripts/screen.py register --execute || echo "::warning::screen.py register failed; extract_ready.py runs it again on the Mac"
      - name: Commit and push
        if: steps.inbox.outputs.count != '0'
        id: push
        run: |
          git config user.name "portal-apply"
          git config user.email "portal-apply@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"; echo "pushed=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          who="${{ github.event.inputs.requested_by }}"
          git commit -m "Portal reviews applied${who:+ (requested by $who)}" -m "Applied by the portal-apply workflow from logs/portal/inbox/."
          for i in 1 2 3; do
            if git push; then echo "pushed=yes" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull --rebase
          done
          exit 1
