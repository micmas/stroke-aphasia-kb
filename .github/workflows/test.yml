name: test
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-ci.txt
      - name: Regenerate browser export from this revision
        run: python3 scripts/export_webapp.py --out export/stroke-aphasia-kb.json --fixtures export --indent 1
      - run: npm test
  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python3 -c "import pymupdf"
      - name: Run all Python checks
        run: |
          rc=0
          for test_file in tests/test_*.py; do
            echo "::group::$test_file"
            python3 "$test_file" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"
