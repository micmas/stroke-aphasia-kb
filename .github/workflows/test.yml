name: test
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
  screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas pyyaml pymupdf
      - run: python3 tests/test_screening.py
      - run: python3 tests/test_review_app.py
