name: test
on:
  pull_request:
  push:
    branches: [main]
jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pandas pyyaml pymupdf
      - name: Run all Python checks
        run: |
          python3 tests/test_screening.py
          python3 tests/test_review_app.py
          python3 tests/test_review_guardrails.py
          python3 tests/test_schema_v28.py
