name: open-access-papers
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      chapter:
        type: choice
        options: [all, aphasia, dysphagia]
        default: all
      max_records:
        description: Maximum records per chapter in this run
        default: '500'
permissions:
  contents: read
concurrency:
  group: open-access-papers
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CHAPTER: ${{ inputs.chapter || 'all' }}
      MAX_RECORDS: ${{ inputs.max_records || '500' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml pymupdf
      - name: Collect licensed PDFs and remove excluded copies
        run: python scripts/collect_open_access.py --chapter "$CHAPTER" --max-records "$MAX_RECORDS" --minutes 45
