<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" font-family="Inter, Helvetica Neue, Arial, sans-serif" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The review portal: what moves where</title>
<desc id="d">The maintainer's machine publishes annotated PDFs, exports and the screening queue to a private Cloudflare Pages site; reviewers sign in with a one-time code, review and screen there, and their decisions and uploaded PDFs come back as records that the maintainer applies.</desc>
<rect width="1180" height="620" fill="#fff"/>
<defs><marker id="ah-5a5a66" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5a5a66"/></marker><marker id="ah-52489c" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52489c"/></marker><marker id="ah-4062bb" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4062bb"/></marker><marker id="ah-f45b69" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#f45b69"/></marker><marker id="ah-1f7f7f" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1f7f7f"/></marker></defs>
<rect x="24" y="56" width="330" height="520" rx="8" fill="#f7f7f7" stroke="#5a5a66" stroke-width="2" stroke-dasharray="6 4"/>
<text x="40" y="84" font-size="15" fill="#2b2b3a" font-weight="700" text-anchor="start" >The maintainer’s machine</text>
<text x="40" y="102" font-size="11.5" fill="#5a5a66" font-weight="normal" text-anchor="start" font-style="italic">the only place that writes to the KB</text>
<rect x="40" y="118" width="298" height="74" rx="8" fill="#fff" stroke="#1f7f7f" stroke-width="2" />
<text x="52" y="139" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >papers/   (= the OneDrive folder calmar-papers)</text>
<text x="52" y="158.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >&lt;Key&gt;.pdf — the source, never in git</text>
<text x="52" y="173.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >&lt;Key&gt;_annotated.pdf — its quotes highlighted</text>
<rect x="40" y="204" width="298" height="58" rx="8" fill="#fff" stroke="#52489c" stroke-width="2" />
<text x="52" y="225" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >drafts/ · export/*.json · screening/</text>
<text x="52" y="244.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >findings awaiting review · exports · register</text>
<rect x="40" y="274" width="298" height="58" rx="8" fill="#fff" stroke="#5a5a66" stroke-width="2" />
<text x="52" y="295" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >scripts/publish_portal.py --deploy</text>
<text x="52" y="314.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >PDFs sorted by licence, exports and queue → portal</text>
<rect x="40" y="412" width="298" height="148" rx="8" fill="#fff" stroke="#f45b69" stroke-width="2" />
<text x="52" y="433" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >scripts/portal_import.py --execute</text>
<text x="52" y="452.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >screen → screening/candidates.yaml</text>
<text x="52" y="467.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >verdict · edit · mark · comment → the draft</text>
<text x="52" y="483.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >pdf → papers/  (pulled from the bucket)</text>
<text x="52" y="498.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >approve, by an approver → promote.py</text>
<text x="52" y="514.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >then export and publish again</text>
<rect x="404" y="56" width="380" height="520" rx="8" fill="#fff" stroke="#4062bb" stroke-width="2" />
<text x="420" y="84" font-size="15" fill="#2b2b3a" font-weight="700" text-anchor="start" >Cloudflare  (the project’s account)</text>
<text x="420" y="102" font-size="11.5" fill="#5a5a66" font-weight="normal" text-anchor="start" font-style="italic">review portal · review.aphasia-kb.app</text>
<rect x="420" y="118" width="348" height="58" rx="8" fill="#eef8f8" stroke="#1f7f7f" stroke-width="2" />
<text x="432" y="139" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >cc/   public — Creative-Commons papers</text>
<text x="432" y="158.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >no sign-in; the explorer links straight here</text>
<rect x="420" y="188" width="348" height="74" rx="8" fill="#eef1fa" stroke="#4062bb" stroke-width="2" />
<text x="432" y="209" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >pdf/ · screening.json · export/</text>
<text x="432" y="228.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >behind Cloudflare Access: allow-listed emails,</text>
<text x="432" y="243.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >one-time code — the Reviewer team only</text>
<rect x="420" y="274" width="348" height="74" rx="8" fill="#f1effa" stroke="#52489c" stroke-width="2" />
<text x="432" y="295" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >the portal page</text>
<text x="432" y="314.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >Drafts beside the annotated PDF · Title/abstract ·</text>
<text x="432" y="329.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >Full text · PDFs · My reviews</text>
<rect x="420" y="360" width="348" height="74" rx="8" fill="#f7f7f7" stroke="#5a5a66" stroke-width="2" />
<text x="432" y="381" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >Functions   /api/me · /api/reviews · /api/upload</text>
<text x="432" y="400.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >check the Access token;</text>
<text x="432" y="415.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >write one record per decision to GitHub</text>
<rect x="420" y="446" width="348" height="74" rx="8" fill="#fdf0f1" stroke="#f45b69" stroke-width="2" />
<text x="432" y="467" font-size="12.5" fill="#2b2b3a" font-weight="600" text-anchor="start" >R2 bucket   (private)</text>
<text x="432" y="486.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >a PDF a reviewer uploads waits here until</text>
<text x="432" y="501.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >the maintainer pulls it — then it is deleted</text>
<text x="420" y="556" font-size="11.5" fill="#5a5a66" font-weight="normal" text-anchor="start" font-style="italic">nothing here can write to the KB</text>
<rect x="836" y="56" width="320" height="166" rx="8" fill="#fff" stroke="#52489c" stroke-width="2" />
<text x="852" y="84" font-size="15" fill="#2b2b3a" font-weight="700" text-anchor="start" >Reviewers   (the Reviewer team)</text>
<text x="852" y="106.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >sign in with a one-time code sent to an</text>
<text x="852" y="121.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >allow-listed email — no account, no password</text>
<text x="852" y="137.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" ></text>
<text x="852" y="152.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >screen titles/abstracts and full texts, review</text>
<text x="852" y="168.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >drafts beside the PDF, fix fields, add passages,</text>
<text x="852" y="183.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >mark for re-extraction, upload a missing PDF</text>
<text x="852" y="210" font-size="11.5" fill="#52489c" font-weight="600" text-anchor="start" >→ sign in, review</text>
<rect x="836" y="240" width="320" height="126" rx="8" fill="#f7f7f7" stroke="#5a5a66" stroke-width="2" />
<text x="852" y="268" font-size="15" fill="#2b2b3a" font-weight="700" text-anchor="start" >GitHub   micmas/stroke-aphasia-kb</text>
<text x="852" y="290.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >logs/portal/inbox/&lt;stamp&gt;_&lt;kind&gt;_&lt;who&gt;_&lt;id&gt;.json</text>
<text x="852" y="305.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >one commit per record, under the reviewer’s email</text>
<text x="852" y="321.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" ></text>
<text x="852" y="336.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >the repository ships findings and DOIs, never a PDF</text>
<rect x="836" y="390" width="320" height="120" rx="8" fill="#fff" stroke="#1f7f7f" stroke-width="2" />
<text x="852" y="418" font-size="15" fill="#2b2b3a" font-weight="700" text-anchor="start" >Explorer   aphasia-kb.app (public)</text>
<text x="852" y="440.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >findings · matrix · papers · coverage · get involved</text>
<text x="852" y="455.5" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >reads the same exports; links the public cc/ PDFs;</text>
<text x="852" y="471.0" font-size="12" fill="#5a5a66" font-weight="normal" text-anchor="start" >“Review ↗” leads to the portal</text>
<path d="M338,303 L404,303" stroke="#5a5a66" stroke-width="1.8" fill="none" marker-end="url(#ah-5a5a66)" />
<text x="371.0" y="294" font-size="11.5" fill="#5a5a66" font-weight="normal" text-anchor="middle" >publish</text>
<path d="M836,150 L806,150 L806,311 L768,311" stroke="#52489c" stroke-width="1.8" fill="none" marker-end="url(#ah-52489c)" />
<path d="M768,397 L790,397 L790,300 L836,300" stroke="#5a5a66" stroke-width="1.8" fill="none" marker-end="url(#ah-5a5a66)" />
<path d="M836,455 L822,455 L822,147 L768,147" stroke="#1f7f7f" stroke-width="1.8" fill="none" marker-end="url(#ah-1f7f7f)" />
<path d="M1136,366 L1136,376 L1168,376 L1168,598 L194,598 L194,560" stroke="#f45b69" stroke-width="1.8" fill="none" marker-end="url(#ah-f45b69)" />
<text x="600" y="592" font-size="11.5" fill="#f45b69" font-weight="normal" text-anchor="middle" >git pull → python scripts/portal_import.py --execute</text>
<path d="M420,500 L338,500" stroke="#f45b69" stroke-width="1.8" fill="none" marker-end="url(#ah-f45b69)" />
<text x="379.0" y="478" font-size="11.5" fill="#f45b69" font-weight="normal" text-anchor="middle" >pulled,</text>
<text x="379.0" y="492" font-size="11.5" fill="#f45b69" font-weight="normal" text-anchor="middle" >then deleted</text>
</svg>