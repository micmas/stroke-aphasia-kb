# Search strategies — the pre-specified half of the protocol (docs/SCREENING.md §3).
#
# Each strategy answers one question family (§1) or serves one evidence gap
# (atlas_mapping/evidence_gaps.yaml). `screen.py search --strategy <id> --db <db>`
# expands the query below, runs it, and records in screening/searches.yaml the
# verbatim expanded string, the strategy id and the protocol fingerprint
# (sha256 of docs/SCREENING.md + this file), so every hit is traceable to the
# protocol version that produced it.
#
# Lock before searching: set `status: locked`, commit this file and
# docs/SCREENING.md, then run. `--execute` refuses a strategy run while the
# status is draft or either file has uncommitted changes. A change after
# locking is an amendment: bump `version`, say why under `amendments`, commit,
# and re-run the affected strategies (the register de-duplicates).
#
# Blocks are written once per database and pasted into queries as ${name}.
# PubMed: MeSH + [tiab], truncation with *. OpenAlex: run as a
# title_and_abstract.search filter; boolean operators in capitals, no
# wildcards (OpenAlex stems words itself), no commas. Scopus: for the UQ
# Library interface; run there and bring the RIS in with
# `screen.py import --strategy <id> --db scopus --file …`. PsycINFO: UQ Library
# provides APA PsycInfo on EBSCOhost; the strings use EBSCO field codes (TI, AB,
# DE = exact subject heading, ZC = methodology), are pasted into Advanced Search
# with the Published Date limiter set to the years below, and the RIS export
# comes in with `screen.py import --strategy <id> --db psycinfo`.
# Before locking, check in the APA Thesaurus (EBSCO "Subject terms") that each DE
# heading used below exists as written — Aphasia, Dysarthria, Cerebrovascular
# Accidents, Cerebrovascular Disorders, Magnetic Resonance Imaging, Functional
# Magnetic Resonance Imaging, Neuroimaging, Diffusion Tensor Imaging, Speech
# Therapy, Language Therapy, Transcranial Magnetic Stimulation, Prognosis,
# Recovery (Disorders), Prosody, Executive Function — and that ZC accepts the
# methodology values Clinical Trial, Meta Analysis, Systematic Review,
# Literature Review. Fix a heading here (draft) rather than in the interface.
#
# Dates: `years` below applies to every strategy that does not set its own:
# PubMed and OpenAlex runs get it as a publication-date filter (recorded under
# `filters`), Scopus strings get `AND PUBYEAR > 1999` appended by
# `screen.py strategies --show`. The upper limit is the search date.

version: 1
status: draft            # draft → locked (then commit) before the first --execute
protocol_owner: michele
amendments: []

# Publication years searched (docs/SCREENING.md §3.1). 2000 onward: routine
# clinical MRI with diffusion and perfusion imaging, then voxel-wise
# lesion-symptom mapping (2003) and tractography, made lesion localisation
# comparable to what the KB maps onto atlases; for therapy and prognosis, it
# also marks contemporary stroke care (stroke units, thrombolysis). Earlier
# pillar papers enter by citation chasing (§3), never by the searches.
years: 2000-

# Pre-lock calibration (not protocol searches; nothing entered the register).
# PubMed counts and benchmark recall measured 2026-10-27 through E-utilities.
# Benchmark: 151 legacy includes, 139 of them in PubMed (no DOI: 6 book/chapter
# reviews; not in PubMed: 6, four of them Aphasiology papers — PsycINFO/Scopus
# must cover those).
calibration:
  - date: 2026-10-27
    database: pubmed
    draft: first draft (stroke required everywhere; aphasia terms only)
    union_hits: ~11000
    benchmark_found: 105 of 139 (76 %)
    finding: >-
      Two systematic losses. (1) Lesion studies of language that never say
      "aphasia" (alexia, dyslexia/dysgraphia, agrammatic comprehension, verbal
      fluency, speech comprehension). (2) Therapy papers and reviews that say
      "aphasia" but never "stroke". Amended: q1b added; q2a, q2b, q4 no longer
      require the stroke block; focal damage / single-subject / generalisation
      terms added.
  - date: 2026-10-27
    database: pubmed
    draft: this file
    hits: {q1_lesion_impairment: 4682, q1b_language_lesion_mapping: 2847, q2a_therapy_efficacy: 2147,
           q2b_therapy_response_neural: 2583, q3_predictor_outcome: 3957, q4_synthesis: 1967,
           q5_recruitment_meta: 915}
    union_hits: 11859
    benchmark_found: 120 of 139 (86 %)
    missed_probably_out_of_scope: [C0002, C0022, C0098, C0099, C0100, C0116, C0106, C0108, C0141, C0146, C0155, C0157]
    missed_in_scope: [C0012, C0073, C0080, C0104, C0109, C0110, C0126]
    finding: >-
      Excluding the 12 probably out of scope (healthy-volunteer or theoretical
      papers, non-language cognition, dysarthria, VR rehabilitation), recall is
      120/127 (94 %). The 7 in-scope misses: three narrative aphasia reviews
      that never say stroke (C0080, C0104, C0126 — q4 takes narrative reviews
      only with stroke, to stay under ~2,000 hits), a therapy-imaging paper
      without stroke or therapy MeSH (C0012), a lesion study with no population
      term (C0073), a pure-alexia eye-movement study (C0109), and Bates 2003
      VLSM, which has no abstract (C0110). Citation chasing (§3) is the route
      for these.
  - date: 2026-10-27
    database: pubmed
    draft: this file, after the scope decisions of 2026-10-27 (years 2000-, q1c, q4 narrative reviews need stroke + imaging)
    hits_2000_on: {q1_lesion_impairment: 3528, q1b_language_lesion_mapping: 2145, q1c_cognition_prosody_lesion: 1041,
                   q2a_therapy_efficacy: 2014, q2b_therapy_response_neural: 2382, q3_predictor_outcome: 3429,
                   q4_synthesis: 1466, q5_recruitment_meta: 907}
    union_hits: 10281
    benchmark: 139 in PubMed; 3 published before 2000 (C0022, C0047, C0133) → 136 in the window
    benchmark_found: 123 of 136 (90 %)
    missed_out_of_scope: [C0002, C0098, C0099, C0100, C0080, C0104, C0126, C0106, C0108]
    missed_in_scope: [C0012, C0073, C0109, C0110]
    finding: >-
      Out of scope under the 2026-10-27 decisions: a primary healthy-volunteer
      study (C0002), narrative reviews that do not name stroke and neuroimaging
      (C0098, C0099, C0100, C0080, C0104, C0126), dysarthria and VR-rehabilitation
      reviews (C0106, C0108). Recall on in-scope, in-window benchmark papers:
      123/127 (97 %). The 4 in-scope misses and the pre-2000 pillars (Geschwind
      1965, Dronkers 1996, Pedersen 1995, Goldenberg 1994, Nadeau & Crosson 1997,
      Crosson 1999) are candidates for citation chasing.
  - date: 2026-10-27
    database: pubmed
    draft: this file, with dysarthria in scope (aphasia block + "Dysarthria"[Mesh] OR dysarthri*[tiab])
    hits_2000_on: {q1_lesion_impairment: 4465, q1b_language_lesion_mapping: 2145, q1c_cognition_prosody_lesion: 1041,
                   q2a_therapy_efficacy: 2375, q2b_therapy_response_neural: 2864, q3_predictor_outcome: 4037,
                   q4_synthesis: 1703, q5_recruitment_meta: 907}
    union_hits: 11864
    benchmark_found: 124 of 136 in the window (91 %)
    missed_out_of_scope: [C0002, C0098, C0099, C0100, C0080, C0104, C0126, C0108]
    missed_in_scope: [C0012, C0073, C0109, C0110]
    finding: >-
      Dysarthria adds ~1,600 records and finds the dysarthria Cochrane review
      (C0106). In-scope recall 124/128 (97 %). Note that the aphasia block now
      means "aphasia or motor speech disorder"; the gap strategies inherit it.

