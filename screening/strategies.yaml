    lesion_symptom: >-
      (TI ("symptom mapping" OR VLSM OR "voxel-based lesion*" OR "voxel-wise lesion*" OR "lesion-symptom" OR
      "lesion symptom" OR "lesion-behavio*" OR "lesion-deficit" OR "lesion mapping" OR "lesion analys*" OR
      "lesion location*" OR "lesion loci" OR "lesion locus" OR "lesion site*" OR "lesion load" OR "lesion
      network mapping" OR "strategic infarct*" OR "infarct location*" OR disconnectom* OR "lesion-based" OR
      "lesion pattern*") OR AB ("symptom mapping" OR VLSM OR "voxel-based lesion*" OR "voxel-wise lesion*" OR
      "lesion-symptom" OR "lesion symptom" OR "lesion-behavio*" OR "lesion-deficit" OR "lesion mapping" OR
      "lesion analys*" OR "lesion location*" OR "lesion loci" OR "lesion locus" OR "lesion site*" OR "lesion
      load" OR "lesion network mapping" OR "strategic infarct*" OR "infarct location*" OR disconnectom* OR
      "lesion-based" OR "lesion pattern*"))
    cognition: >-
      (DE "Executive Function" OR TI (cogniti* OR executive OR "working memory" OR "short-term memory" OR
      "cognitive control" OR "processing speed" OR "decision making" OR "problem solving" OR reasoning OR
      "attentional control" OR prosod* OR "emotion recognition") OR AB (cogniti* OR executive OR "working
      memory" OR "short-term memory" OR "cognitive control" OR "processing speed" OR "decision making" OR
      "problem solving" OR reasoning OR "attentional control" OR prosod* OR "emotion recognition"))
    prosody: >-
      (DE "Prosody" OR TI (prosod* OR aprosodi* OR "emotion recognition" OR "tone of voice") OR AB (prosod* OR
      aprosodi* OR "emotion recognition" OR "tone of voice"))
    therapy: >-
      (DE "Speech Therapy" OR DE "Language Therapy" OR DE "Transcranial Magnetic Stimulation" OR TI (therap*
      OR treatment* OR rehabilit* OR intervention* OR training OR tDCS OR rTMS OR "brain stimulation" OR
      "transcranial magnetic stimulation" OR "transcranial direct current stimulation" OR pharmacotherap*) OR
      AB (therap* OR treatment* OR rehabilit* OR intervention* OR training OR tDCS OR rTMS OR "brain
      stimulation" OR "transcranial magnetic stimulation" OR "transcranial direct current stimulation" OR
      pharmacotherap*))
    aphasia_therapy: >-
      (DE "Speech Therapy" OR DE "Language Therapy" OR TI ("aphasia therapy" OR "aphasia treatment" OR
      "aphasia rehabilitation" OR "speech therapy" OR "language therapy" OR "speech and language therapy") OR
      AB ("aphasia therapy" OR "aphasia treatment" OR "aphasia rehabilitation" OR "speech therapy" OR
      "language therapy" OR "speech and language therapy"))
    trial_design: >-
      (ZC "Clinical Trial" OR ZC "Meta Analysis" OR ZC "Systematic Review" OR TI (randomi* OR "controlled
      trial" OR crossover OR "cross-over" OR "case series" OR "single-case" OR "multiple baseline" OR "single
      subject" OR "single-subject" OR "systematic review" OR meta-analy*) OR AB (randomi* OR "controlled
      trial" OR crossover OR "cross-over" OR "case series" OR "single-case" OR "multiple baseline" OR "single
      subject" OR "single-subject" OR "systematic review" OR meta-analy*))
    response: >-
      (TI (respond* OR responder* OR "treatment response" OR "response to treatment" OR "response to therapy"
      OR "treatment outcome*" OR "treatment-induced" OR "treatment gains" OR "therapy gains" OR generali* OR
      "treatment effect*") OR AB (respond* OR responder* OR "treatment response" OR "response to treatment" OR
      "response to therapy" OR "treatment outcome*" OR "treatment-induced" OR "treatment gains" OR "therapy
      gains" OR generali* OR "treatment effect*"))
    predictor: >-
      (DE "Prognosis" OR DE "Recovery (Disorders)" OR TI (predict* OR prognos* OR recover* OR longitudinal OR
      determinant* OR "risk factor*") OR AB (predict* OR prognos* OR recover* OR longitudinal OR determinant*
      OR "risk factor*"))
    systematic: >-
      (ZC "Systematic Review" OR ZC "Meta Analysis" OR TI ("systematic review" OR meta-analy* OR "scoping
      review") OR AB ("systematic review" OR meta-analy* OR "scoping review"))
    review: >-
      (ZC "Literature Review" OR ZC "Systematic Review")

# `question`: the §1 question family. `buckets`: the KB folders whose legacy papers
# this strategy is expected to find — the recall check measures the strategy
# against the benchmark papers extracted into those folders.
strategies:

  # --- the question families (§1) -------------------------------------------------
  - id: q1_lesion_impairment
    question: lesion → impairment
    buckets: [regions, impairments]
    for: [q1_lesion_impairment]
    pubmed: ${aphasia} AND ${stroke} AND ${imaging}
    openalex: ${aphasia} AND ${stroke} AND ${imaging}
    scopus: ${aphasia} AND ${stroke} AND ${imaging}
    psycinfo: ${aphasia} AND ${stroke} AND ${imaging}

  - id: q1b_language_lesion_mapping
    question: lesion → impairment (language outcomes not called aphasia)
    buckets: [regions, impairments]
    for: [q1_lesion_impairment]
    notes: >-
      Lesion–behaviour studies of reading, writing, comprehension, fluency,
      naming or prosody after focal damage often never use the word aphasia.
      Paired with lesion-mapping terms rather than the broad imaging block to
      stay near 3,000 PubMed hits.
    pubmed: ${language} AND ${stroke} AND ${lesion_mapping}
    openalex: ${language} AND ${stroke} AND ${lesion_mapping}
    scopus: ${language} AND ${stroke} AND ${lesion_mapping}
    psycinfo: ${language} AND ${stroke} AND ${lesion_mapping}

  - id: q1c_cognition_prosody_lesion
    question: lesion → impairment (prosody and domain-general cognition after stroke)
    buckets: [regions, impairments]
    for: [q1_lesion_impairment]
    notes: >-
      In scope since 2026-10-27. Paired with the strict lesion–symptom block, not
      the broad lesion-mapping one: with "white matter" the cognition arm returns
      ~8,800 PubMed hits, mostly small-vessel-disease imaging. Prosody papers
      also enter through ordinary imaging terms (few of them use lesion-mapping
      vocabulary).
    pubmed: ((${cognition} AND ${lesion_symptom}) OR (${prosody} AND ${imaging})) AND ${stroke}
    openalex: ((${cognition} AND ${lesion_symptom}) OR (${prosody} AND ${imaging})) AND ${stroke}
    scopus: ((${cognition} AND ${lesion_symptom}) OR (${prosody} AND ${imaging})) AND ${stroke}
    psycinfo: ((${cognition} AND ${lesion_symptom}) OR (${prosody} AND ${imaging})) AND ${stroke}

  - id: q2a_therapy_efficacy
    question: therapy → response (efficacy)
    buckets: [therapies, ingredients]
    for: [q2_therapy_response]
    notes: >-
      No stroke block: aphasia therapy papers often never say stroke (primary
      progressive and developmental populations are excluded at screening,
      not_stroke). The design block keeps controlled trials, crossover,
      case-series, single-case / single-subject experimental designs and
      syntheses, and drops uncontrolled single-case reports (below the §2
      sample threshold anyway).
    pubmed: ${aphasia} AND ${therapy} AND ${trial_design}
    openalex: ${aphasia} AND ${therapy} AND ${trial_design}
    scopus: ${aphasia} AND ${therapy} AND ${trial_design}
    psycinfo: ${aphasia} AND ${therapy} AND ${trial_design}
    psycinfo: ${aphasia} AND ${therapy} AND ${trial_design}

  - id: q2b_therapy_response_neural
    question: therapy → response (who responds; neural correlates of response)
    buckets: [therapies, ingredients]
    for: [q2_therapy_response]
    pubmed: ${aphasia} AND ${therapy} AND (${response} OR ${imaging}) AND (${stroke} OR ${aphasia_therapy})
    openalex: ${aphasia} AND ${therapy} AND (${response} OR ${imaging}) AND (${stroke} OR ${aphasia_therapy})
    scopus: ${aphasia} AND ${therapy} AND (${response} OR ${imaging}) AND (${stroke} OR ${aphasia_therapy})
    psycinfo: ${aphasia} AND ${therapy} AND (${response} OR ${imaging}) AND (${stroke} OR ${aphasia_therapy})

  - id: q3_predictor_outcome
    question: predictor → outcome
    buckets: [predictors]
    for: [q3_predictor_outcome]
    pubmed: ${aphasia} AND ${stroke} AND ${predictor}
    openalex: ${aphasia} AND ${stroke} AND ${predictor}
    scopus: ${aphasia} AND ${stroke} AND ${predictor}
    psycinfo: ${aphasia} AND ${stroke} AND ${predictor}

  - id: q4_synthesis
    question: synthesis (reviews and meta-analyses)
    buckets: [reviews]
    for: [q4_synthesis]
    notes: >-
      Decided 2026-10-27: systematic reviews, meta-analyses and scoping reviews
      of aphasia; narrative reviews only when they cover neuroimaging (or lesion)
      evidence in stroke — the same rule is an eligibility criterion (§2,
      narrative_review_out_of_scope).
    pubmed: ${aphasia} AND (${systematic} OR (${stroke} AND ${imaging} AND ${review}))
    openalex: ${aphasia} AND (${systematic} OR (${stroke} AND ${imaging} AND ${review}))
    scopus: ${aphasia} AND (${systematic} OR (${stroke} AND ${imaging} AND ${review}))
    psycinfo: ${aphasia} AND (${systematic} OR (${stroke} AND ${imaging} AND ${review}))

  - id: q5_recruitment_meta
    question: recruitment (healthy-volunteer language mapping) — syntheses only
    buckets: []
    for: [q5_recruitment]
    notes: >-
      Decided 2026-10-27: healthy-volunteer imaging enters only through
      coordinate-based meta-analyses (ALE, MKDA, SDM) and systematic reviews,
      not primary studies. A pillar primary study the field relies on (e.g.
      Saur 2008) enters by citation chasing from an included paper, with the
      reason recorded (§3, `screen.py chase`).
    pubmed: >-
      ("Language"[Mesh] OR language[tiab] OR naming[tiab] OR semantic*[tiab] OR phonolog*[tiab]
      OR syntax[tiab] OR syntactic[tiab] OR "speech production"[tiab] OR "sentence comprehension"[tiab]
      OR "word production"[tiab] OR reading[tiab]) AND ("Meta-Analysis"[pt] OR meta-analy*[tiab]
      OR "activation likelihood"[tiab] OR "coordinate-based"[tiab] OR MKDA[tiab]) AND ("Magnetic Resonance Imaging"[Mesh]
      OR fMRI[tiab] OR "functional magnetic resonance"[tiab] OR "positron emission"[tiab] OR neuroimaging[tiab])
    openalex: >-
      (language OR naming OR semantic OR phonological OR syntax OR syntactic OR "speech production"
      OR "sentence comprehension" OR "word production" OR reading) AND ("meta-analysis" OR "activation likelihood"
      OR "coordinate-based" OR MKDA) AND (fMRI OR "functional magnetic resonance" OR "positron emission" OR neuroimaging)
    scopus: >-
      TITLE-ABS-KEY(language OR naming OR semantic* OR phonolog* OR syntax OR syntactic OR "speech production"
      OR "sentence comprehension" OR "word production" OR reading) AND TITLE-ABS-KEY(meta-analy*
      OR "activation likelihood" OR "coordinate-based" OR MKDA) AND TITLE-ABS-KEY(fMRI
      OR "functional magnetic resonance" OR "positron emission" OR neuroimaging)
    psycinfo: >-
      (TI (language OR naming OR semantic* OR phonolog* OR syntax OR syntactic OR "speech production" OR
      "sentence comprehension" OR "word production" OR reading) OR AB (language OR naming OR semantic* OR
      phonolog* OR syntax OR syntactic OR "speech production" OR "sentence comprehension" OR "word production"
      OR reading)) AND (ZC "Meta Analysis" OR TI (meta-analy* OR "activation likelihood" OR "coordinate-based"
      OR MKDA) OR AB (meta-analy* OR "activation likelihood" OR "coordinate-based" OR MKDA)) AND (TI (fMRI OR
      "functional magnetic resonance" OR "positron emission" OR neuroimaging) OR AB (fMRI OR "functional
      magnetic resonance" OR "positron emission" OR neuroimaging))

  # --- evidence-gap searches (atlas_mapping/evidence_gaps.yaml) ---------------------
  # Narrower, mostly subsets of q1; they exist so the Coverage view can report each
  # gap's own search, and to catch papers whose abstracts never use the q1 imaging terms.
  - id: gap_thalamus_basal_ganglia
    question: lesion → impairment
    buckets: [regions]
    for: [thalamus_basal_ganglia]
    pubmed: >-
      ${aphasia} AND ("Thalamus"[Mesh] OR "Basal Ganglia"[Mesh] OR thalam*[tiab] OR "basal ganglia"[tiab]
      OR caudate[tiab] OR putamen[tiab] OR putaminal[tiab] OR striat*[tiab] OR pallid*[tiab]
      OR "internal capsule"[tiab] OR "subcortical aphasia"[tiab])
    openalex: >-
      ${aphasia} AND (thalamus OR thalamic OR "basal ganglia" OR caudate OR putamen OR putaminal OR striatum
      OR striatal OR pallidum OR "internal capsule" OR "subcortical aphasia")

  - id: gap_extreme_capsule_ventral_stream
    question: lesion → impairment
    buckets: [regions]
    for: [extreme_capsule_ventral_stream]
    pubmed: >-
      ${aphasia} AND ("extreme capsule"[tiab] OR "ventral stream"[tiab] OR "ventral pathway*"[tiab]
      OR "inferior fronto-occipital"[tiab] OR "inferior frontooccipital"[tiab] OR IFOF[tiab] OR uncinate[tiab])
    openalex: >-
      ${aphasia} AND ("extreme capsule" OR "ventral stream" OR "ventral pathway" OR "inferior fronto-occipital"
      OR "inferior frontooccipital" OR IFOF OR uncinate)

  - id: gap_anterior_thalamic_radiation_ifof_semantics
    question: lesion → impairment
    buckets: [regions]
    for: [anterior_thalamic_radiation_ifof_semantics]
    pubmed: >-
      ${aphasia} AND ("thalamic radiation*"[tiab] OR "anterior thalamic"[tiab] OR "inferior fronto-occipital"[tiab]
      OR "inferior frontooccipital"[tiab] OR IFOF[tiab])
    openalex: >-
      ${aphasia} AND ("thalamic radiation" OR "anterior thalamic" OR "inferior fronto-occipital"
      OR "inferior frontooccipital" OR IFOF)

  - id: gap_frontal_aslant_sma_fluency
    question: lesion → impairment
    buckets: [regions]
    for: [frontal_aslant_sma_fluency]
    pubmed: >-
      ${aphasia} AND ("frontal aslant"[tiab] OR "aslant tract"[tiab] OR "supplementary motor"[tiab]
      OR "pre-SMA"[tiab] OR "medial frontal"[tiab] OR "transcortical motor"[tiab] OR "dynamic aphasia"[tiab])
    openalex: >-
      ${aphasia} AND ("frontal aslant" OR "aslant tract" OR "supplementary motor" OR "pre-SMA"
      OR "medial frontal" OR "transcortical motor" OR "dynamic aphasia")

  - id: gap_insula_apraxia_of_speech
    question: lesion → impairment
    buckets: [regions]
    for: [insula_apraxia_of_speech]
    notes: Apraxia of speech is searched with the stroke block, not the aphasia block — some AOS papers never say aphasia.
    pubmed: >-
      ("apraxia of speech"[tiab] OR "speech apraxia"[tiab] OR "verbal apraxia"[tiab] OR "Apraxias"[Mesh])
      AND ${stroke} AND ("Insular Cortex"[Mesh] OR insula*[tiab] OR lesion*[tiab] OR precentral[tiab]
      OR premotor[tiab] OR "symptom mapping"[tiab])
    openalex: >-
      ("apraxia of speech" OR "speech apraxia" OR "verbal apraxia") AND ${stroke}
      AND (insula OR insular OR lesion OR precentral OR premotor OR "symptom mapping")

  - id: gap_basal_temporal_naming
    question: lesion → impairment
    buckets: [regions]
    for: [basal_temporal_naming]
    pubmed: >-
      ${aphasia} AND ("inferior temporal"[tiab] OR fusiform[tiab] OR "basal temporal"[tiab]
      OR "ventral temporal"[tiab] OR occipitotemporal[tiab] OR "occipito-temporal"[tiab] OR "temporo-occipital"[tiab]
      OR "posterior cerebral artery"[tiab])
    openalex: >-
      ${aphasia} AND ("inferior temporal" OR fusiform OR "basal temporal" OR "ventral temporal"
      OR occipitotemporal OR "occipito-temporal" OR "temporo-occipital" OR "posterior cerebral artery")

  - id: gap_right_hemisphere
    question: lesion → impairment / therapy → response
    buckets: [regions]
    for: [right_hemisphere]
    pubmed: >-
      ${aphasia} AND ${stroke} AND ("right hemisphere"[tiab] OR "right-hemisphere"[tiab] OR contralesional[tiab]
      OR homolog*[tiab] OR homotop*[tiab] OR interhemispheric[tiab] OR "right inferior frontal"[tiab]
      OR "Functional Laterality"[Mesh])
    openalex: >-
      ${aphasia} AND ${stroke} AND ("right hemisphere" OR contralesional OR homologous OR homotopic
      OR interhemispheric OR "right inferior frontal" OR laterality)
