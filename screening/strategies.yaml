# `question`: the §1 question family. `buckets`: the KB folders whose legacy papers
# this strategy is expected to find — the recall check measures the strategy
# against the benchmark papers extracted into those folders.
strategies:

  # --- the question families (§1) -------------------------------------------------
  - id: q1_lesion_impairment
    question: lesion → impairment
    buckets: [regions, impairments]
    for: [q1_lesion_impairment]
    pubmed: ${aphasia} AND ${stroke} AND ${imaging}
    openalex: ${aphasia} AND ${stroke} AND ${imaging}
    scopus: ${aphasia} AND ${stroke} AND ${imaging}
    psycinfo: ${aphasia} AND ${stroke} AND ${imaging}

  - id: q1b_language_lesion_mapping
    question: lesion → impairment (language outcomes not called aphasia)
    buckets: [regions, impairments]
    for: [q1_lesion_impairment]
    notes: >-
      Lesion–behaviour studies of reading, writing, comprehension, fluency,
      naming or prosody after focal damage often never use the word aphasia.
      Paired with lesion-mapping terms rather than the broad imaging block to
      stay near 3,000 PubMed hits.
    pubmed: ${language} AND ${stroke} AND ${lesion_mapping}
    openalex: ${language} AND ${stroke} AND ${lesion_mapping}
    scopus: ${language} AND ${stroke} AND ${lesion_mapping}
    psycinfo: ${language} AND ${stroke} AND ${lesion_mapping}

  - id: q1c_cognition_prosody_lesion
    question: lesion → impairment (prosody and domain-general cognition after stroke)
    buckets: [regions, impairments]
    for: [q1_lesion_impairment]
    notes: >-
      In scope since 2026-10-27. Paired with the strict lesion–symptom block, not
      the broad lesion-mapping one: with "white matter" the cognition arm returns
      ~8,800 PubMed hits, mostly small-vessel-disease imaging. Prosody papers
      also enter through ordinary imaging terms (few of them use lesion-mapping
      vocabulary).
    pubmed: ((${cognition} AND ${lesion_symptom}) OR (${prosody} AND ${imaging})) AND ${stroke}
    openalex: ((${cognition} AND ${lesion_symptom}) OR (${prosody} AND ${imaging})) AND ${stroke}
    scopus: ((${cognition} AND ${lesion_symptom}) OR (${prosody} AND ${imaging})) AND ${stroke}
    psycinfo: ((${cognition} AND ${lesion_symptom}) OR (${prosody} AND ${imaging})) AND ${stroke}

  - id: q2b_therapy_response_neural
    question: therapy → response, with brain imaging (neural correlates and imaging predictors of response)
    buckets: [therapies, ingredients]
    for: [q2_therapy_response]
    notes: >-
      Scope A (v2): therapy studies enter as primary evidence only with imaging or
      lesion data; therapy efficacy without imaging comes from q4 syntheses. Uses
      the stricter imaging block: therapy abstracts mention "lesion" and "cortical"
      in passing far more often than lesion-mapping abstracts do.
    pubmed: ${aphasia} AND ${therapy} AND ${imaging_strict} AND (${stroke} OR ${aphasia_therapy})
    openalex: ${aphasia} AND ${therapy} AND ${imaging_strict} AND (${stroke} OR ${aphasia_therapy})
    scopus: ${aphasia} AND ${therapy} AND ${imaging_strict} AND (${stroke} OR ${aphasia_therapy})
    psycinfo: ${aphasia} AND ${therapy} AND ${imaging_strict} AND (${stroke} OR ${aphasia_therapy})

  - id: q2c_therapy_response_patient_factors
    question: therapy → response (patient characteristics that predict or moderate response; no imaging required)
    buckets: [therapies, ingredients, predictors]
    for: [q2_therapy_response]
    notes: >-
      Amendment v5. Eligible only when the report relates patient
      characteristics to the response to a named therapy (responder, moderator
      or prediction analyses); a report of overall efficacy alone is
      no_imaging_primary.
    pubmed: ${aphasia} AND ${therapy} AND ${response} AND ${patient_factors} AND (${stroke} OR ${aphasia_therapy})
    openalex: ${aphasia} AND ${therapy} AND ${response} AND ${patient_factors} AND (${stroke} OR ${aphasia_therapy})
    scopus: ${aphasia} AND ${therapy} AND ${response} AND ${patient_factors} AND (${stroke} OR ${aphasia_therapy})
    psycinfo: ${aphasia} AND ${therapy} AND ${response} AND ${patient_factors} AND (${stroke} OR ${aphasia_therapy})

  - id: q3_predictor_outcome
    question: predictor → outcome, with brain imaging (lesion and imaging predictors of severity and recovery)
    buckets: [predictors]
    for: [q3_predictor_outcome]
    notes: >-
      Scope A (v2): clinical and demographic predictors (age, sex, initial
      severity, time post onset) without imaging come from q4 syntheses.
    pubmed: ${aphasia} AND ${stroke} AND ${predictor} AND ${imaging}
    openalex: ${aphasia} AND ${stroke} AND ${predictor} AND ${imaging}
    scopus: ${aphasia} AND ${stroke} AND ${predictor} AND ${imaging}
    psycinfo: ${aphasia} AND ${stroke} AND ${predictor} AND ${imaging}

  - id: q4_synthesis
    question: synthesis (reviews and meta-analyses)
    buckets: [reviews]
    for: [q4_synthesis]
    notes: >-
      Decided 2026-10-27: systematic reviews, meta-analyses and scoping reviews
      of aphasia; narrative reviews only when they cover neuroimaging (or lesion)
      evidence in stroke — the same rule is an eligibility criterion (§2,
      narrative_review_out_of_scope).
    pubmed: ${aphasia} AND (${systematic} OR (${stroke} AND ${imaging} AND ${review}))
    openalex: ${aphasia} AND (${systematic} OR (${stroke} AND ${imaging} AND ${review}))
    scopus: ${aphasia} AND (${systematic} OR (${stroke} AND ${imaging} AND ${review}))
    psycinfo: ${aphasia} AND (${systematic} OR (${stroke} AND ${imaging} AND ${review}))

  - id: q5_recruitment_meta
    question: recruitment (healthy-volunteer language mapping) — syntheses only
    buckets: []
    for: [q5_recruitment]
    notes: >-
      Decided 2026-10-27: healthy-volunteer imaging enters only through
      coordinate-based meta-analyses (ALE, MKDA, SDM) and systematic reviews,
      not primary studies. A pillar primary study the field relies on (e.g.
      Saur 2008) enters by citation chasing from an included paper, with the
      reason recorded (§3, `screen.py chase`).
    pubmed: >-
      ("Language"[Mesh] OR language[tiab] OR naming[tiab] OR semantic*[tiab] OR phonolog*[tiab]
      OR syntax[tiab] OR syntactic[tiab] OR "speech production"[tiab] OR "sentence comprehension"[tiab]
      OR "word production"[tiab] OR reading[tiab]) AND ("Meta-Analysis"[pt] OR meta-analy*[tiab]
      OR "activation likelihood"[tiab] OR "coordinate-based"[tiab] OR MKDA[tiab]) AND ("Magnetic Resonance Imaging"[Mesh]
      OR fMRI[tiab] OR "functional magnetic resonance"[tiab] OR "positron emission"[tiab] OR neuroimaging[tiab])
    openalex: >-
      (language OR naming OR semantic OR phonological OR syntax OR syntactic OR "speech production"
      OR "sentence comprehension" OR "word production" OR reading) AND ("meta-analysis" OR "activation likelihood"
      OR "coordinate-based" OR MKDA) AND (fMRI OR "functional magnetic resonance" OR "positron emission" OR neuroimaging)
    scopus: >-
      TITLE-ABS-KEY(language OR naming OR semantic* OR phonolog* OR syntax OR syntactic OR "speech production"
      OR "sentence comprehension" OR "word production" OR reading) AND TITLE-ABS-KEY(meta-analy*
      OR "activation likelihood" OR "coordinate-based" OR MKDA) AND TITLE-ABS-KEY(fMRI
      OR "functional magnetic resonance" OR "positron emission" OR neuroimaging)
    psycinfo: >-
      (TI (language OR naming OR semantic* OR phonolog* OR syntax OR syntactic OR "speech production" OR
      "sentence comprehension" OR "word production" OR reading) OR AB (language OR naming OR semantic* OR
      phonolog* OR syntax OR syntactic OR "speech production" OR "sentence comprehension" OR "word production"
      OR reading)) AND (ZC "Meta Analysis" OR TI (meta-analy* OR "activation likelihood" OR "coordinate-based"
      OR MKDA) OR AB (meta-analy* OR "activation likelihood" OR "coordinate-based" OR MKDA)) AND (TI (fMRI OR
      "functional magnetic resonance" OR "positron emission" OR neuroimaging) OR AB (fMRI OR "functional
      magnetic resonance" OR "positron emission" OR neuroimaging))

  # --- evidence-gap searches (atlas_mapping/evidence_gaps.yaml) ---------------------
  # Narrower, mostly subsets of q1; they exist so the Coverage view can report each
  # gap's own search, and to catch papers whose abstracts never use the q1 imaging terms.
  - id: gap_thalamus_basal_ganglia
    question: lesion → impairment
    buckets: [regions]
    for: [thalamus_basal_ganglia]
    pubmed: >-
      ${aphasia} AND ("Thalamus"[Mesh] OR "Basal Ganglia"[Mesh] OR thalam*[tiab] OR "basal ganglia"[tiab]
      OR caudate[tiab] OR putamen[tiab] OR putaminal[tiab] OR striat*[tiab] OR pallid*[tiab]
      OR "internal capsule"[tiab] OR "subcortical aphasia"[tiab])
    openalex: >-
      ${aphasia} AND (thalamus OR thalamic OR "basal ganglia" OR caudate OR putamen OR putaminal OR striatum
      OR striatal OR pallidum OR "internal capsule" OR "subcortical aphasia")

  - id: gap_extreme_capsule_ventral_stream
    question: lesion → impairment
    buckets: [regions]
    for: [extreme_capsule_ventral_stream]
    pubmed: >-
      ${aphasia} AND ("extreme capsule"[tiab] OR "ventral stream"[tiab] OR "ventral pathway*"[tiab]
      OR "inferior fronto-occipital"[tiab] OR "inferior frontooccipital"[tiab] OR IFOF[tiab] OR uncinate[tiab])
    openalex: >-
      ${aphasia} AND ("extreme capsule" OR "ventral stream" OR "ventral pathway" OR "inferior fronto-occipital"
      OR "inferior frontooccipital" OR IFOF OR uncinate)

  - id: gap_anterior_thalamic_radiation_ifof_semantics
    question: lesion → impairment
    buckets: [regions]
    for: [anterior_thalamic_radiation_ifof_semantics]
    pubmed: >-
      ${aphasia} AND ("thalamic radiation*"[tiab] OR "anterior thalamic"[tiab] OR "inferior fronto-occipital"[tiab]
      OR "inferior frontooccipital"[tiab] OR IFOF[tiab])
    openalex: >-
