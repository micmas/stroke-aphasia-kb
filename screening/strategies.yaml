# Search strategies — the pre-specified half of the protocol (docs/SCREENING.md §3).
#
# Each strategy answers one question family (§1) or serves one evidence gap
# (atlas_mapping/evidence_gaps.yaml). `screen.py search --strategy <id> --db <db>`
# expands the query below, runs it, and records in screening/searches.yaml the
# verbatim expanded string, the strategy id and the protocol fingerprint
# (sha256 of docs/SCREENING.md + this file), so every hit is traceable to the
# protocol version that produced it.
#
# Lock before searching: set `status: locked`, commit this file and
# docs/SCREENING.md, then run. `--execute` refuses a strategy run while the
# status is draft or either file has uncommitted changes. A change after
# locking is an amendment: bump `version`, say why under `amendments`, commit,
# and re-run the affected strategies (the register de-duplicates).
#
# Blocks are written once per database and pasted into queries as ${name}.
# PubMed: MeSH + [tiab], truncation with *. OpenAlex: run as a
# title_and_abstract.search filter; boolean operators in capitals, no
# wildcards (OpenAlex stems words itself), no commas. Scopus: for the UQ
# Library interface; run there and bring the RIS in with
# `screen.py import --strategy <id> --db scopus --file …`. PsycINFO: UQ Library
# provides APA PsycInfo on EBSCOhost; the strings use EBSCO field codes (TI, AB,
# DE = exact subject heading, ZC = methodology), are pasted into Advanced Search
# with the Published Date limiter set to the years below, and the RIS export
# comes in with `screen.py import --strategy <id> --db psycinfo`.
# Before locking, check in the APA Thesaurus (EBSCO "Subject terms") that each DE
# heading used below exists as written — Aphasia, Dysarthria, Cerebrovascular
# Accidents, Cerebrovascular Disorders, Magnetic Resonance Imaging, Functional
# Magnetic Resonance Imaging, Neuroimaging, Diffusion Tensor Imaging, Speech
# Therapy, Language Therapy, Transcranial Magnetic Stimulation, Prognosis,
# Recovery (Disorders), Prosody, Executive Function — and that ZC accepts the
# methodology values Clinical Trial, Meta Analysis, Systematic Review,
# Literature Review. Fix a heading here (draft) rather than in the interface.
#
# Dates: `years` below applies to every strategy that does not set its own:
# PubMed and OpenAlex runs get it as a publication-date filter (recorded under
# `filters`), Scopus strings get `AND PUBYEAR > 1999` appended by
# `screen.py strategies --show`. The upper limit is the search date.

version: 6
status: locked            # draft → locked (then commit) before the first --execute
protocol_owner: michele
amendments:
  - version: 6
    date: 2026-10-30
    by: michele
    what: >-
      Reason vocabulary only: therapy_no_patient_factors ("therapy study, no
      patient-characteristic analysis") is split from no_imaging_primary, for a
      therapy study without imaging that reports overall effect but relates no
      patient characteristic to the response. Scope and searches unchanged.
    why: >-
      Amendment v5 made the patient-characteristics analysis the deciding point
      for therapy studies; the PRISMA report should say so rather than count them
      as "no imaging".
    when: >-
      during title/abstract and full-text screening; earlier therapy exclusions
      recorded as no_imaging_primary may be re-recorded with the new reason
      (a new decision supersedes, both kept).
  - version: 5
    date: 2026-10-30
    by: michele
    what: >-
      Behavioural primary studies are in scope when they relate patient
      characteristics (demographic, clinical, cognitive, linguistic, genetic) to
      the response to a named therapy — ideally a controlled one. A study that
      reports a therapy's overall effect with no analysis of who responds stays
      out (no_imaging_primary; its evidence comes from syntheses). New strategy
      q2c_therapy_response_patient_factors; the response block gains
      improvement / gain / benefit / therapy outcome / treatment success terms
      (used by q2c only); new block patient_factors.
    why: >-
      Which patients benefit from which therapy informs practice and the
      CALMaR reports even without imaging; these moderator / responder analyses
      are not pooled by most efficacy meta-analyses, so the syntheses route
      alone would miss them.
    when: >-
      after 50 title/abstract decisions; the one exclusion they contain for
      no_imaging_primary (C0076 Bhogal 2003: therapy intensity, not patient
      characteristics) stands.
  - version: 4
    date: 2026-10-28
    by: michele
    what: >-
      Grey literature is excluded: theses and dissertations, books and book
      chapters, and conference abstracts and proceedings papers (reason
      grey_literature; not_full_report keeps editorials, letters, commentaries,
      protocols and errata). Preprints remain eligible. Records are identified by
      rule before screening — the export's own record type (RIS TY, Scopus
      document type) when known, else the DOI prefix (book DOIs) and the source
      title — and reported as removed before screening (PRISMA 2020), with the
      evidence on each record (`screen.py grey`).
    why: >-
      The knowledge base extracts findings with verbatim support from
      peer-reviewed reports; theses, chapters and conference records repeat or
      precede journal reports and are rarely extractable. Preprints are kept
      because recent imaging studies often appear there first (a preprint and its
      journal version are one study: duplicate_report).
    when: >-
      after 50 title/abstract decisions; none of them concerned a thesis, book or
      conference record, so none changes.
  - version: 3
    date: 2026-10-27
    by: michele
    what: >-
      (1) OpenAlex is not searched; its conditional dry run is not done. (2) The
      stopping rule's minimum share of database records screened goes from 30 %
      to 15 %; the other two conditions (last 200 decisions exclusions, ≥ 95 % of
      validation papers screened) are unchanged.
    why: >-
      (1) The v2 searches retrieved 20,777 unique records. PsycINFO, the third
      database, added 2,246 records but no benchmark paper that PubMed and Scopus
      had not already retrieved (120/145 found; in-scope recall ≈ 120/124); a
      fourth, general-purpose index with poorer abstract coverage (v1 pilot:
      OpenAlex q1 recall 61 % against PubMed 75 %) was judged not worth its
      screening load. (2) At 20,777 records a 30 % floor alone means ~6,200
      records; the validation-set condition is the direct check on recall.
    when: before any title/abstract screening decision was recorded.
  - version: 2
    date: 2026-10-27
    by: michele
    what: >-
      Scope A, before any screening. Primary studies are in scope only when they
      relate brain imaging or lesion data to an outcome; evidence without imaging
      (therapy efficacy, clinical and demographic predictors) enters only through
      systematic reviews and meta-analyses (q4). q2a_therapy_efficacy removed;
      q2b_therapy_response_neural and q3_predictor_outcome require imaging
      (new block imaging_strict for q2b). §2 gains the reason no_imaging_primary.
      OpenAlex is run only if its dry run retrieves benchmark papers that PubMed,
      Scopus and PsycINFO did not.
    why: >-
      The knowledge base serves CALMaR, which interprets an individual's lesion:
      its primary evidence must link brain to outcome. Measured on PubMed
      (calibration below), scope A cuts the records to screen by 27 % (11,866 →
      8,681) and loses no benchmark paper except the 17 non-imaging trials and
      cohorts it places, by design, under syntheses.
    pilot: >-
      Protocol v1 was locked and run on 2026-10-27 (PubMed S001–S008, OpenAlex
      S009, a partial Scopus export S010, withdrawn). No record was screened. The
      register was restored to its pre-lock state (SCREEN-RESET in
      logs/extraction_log.md; the v1 runs remain in git history, commits af42791
      and cc7049f) and the protocol revised as above before re-running.

# Publication years searched (docs/SCREENING.md §3.1). 2000 onward: routine
# clinical MRI with diffusion and perfusion imaging, then voxel-wise
# lesion-symptom mapping (2003) and tractography, made lesion localisation
# comparable to what the KB maps onto atlases; for therapy and prognosis, it
# also marks contemporary stroke care (stroke units, thrombolysis). Earlier
# pillar papers enter by citation chasing (§3), never by the searches.
years: 2000-

# Prioritised title/abstract screening (docs/SCREENING.md §4.1): the sheet is
# ordered by a model retrained on every decision; screening stops when all three
# conditions below hold, and the records left unscreened are reported as such.
# Calibration of amendment v5 (PubMed, E-utilities, 2026-10-30): q2c 1,136 records 2000-
# (497 without the added response terms, which missed Simic 2019). Retrieves Gilmore 2019,
# Simic 2019, Brady 2022 (precision rehabilitation), Fridriksson 2018 BDNF; efficacy-only trials
# (Breitenstein 2017, Godecke 2021, Nouwens 2017) are not retrieved, as intended.
prioritised_screening:
  model: tfidf_naive_bayes      # scripts/prioritise.py
  seed: 20261027                # benchmark split and cold-start sampling
  prior_fraction: 0.5           # share of in-window benchmark papers used as prior knowledge; the rest validate
  stop:
    min_screened_fraction: 0.15 # of the database-arm records (0.30 until amendment v3)
    consecutive_exclusions: 200 # the last 200 decisions in ranked order were all exclusions
    validation_found: 0.95      # of the validation benchmark papers the searches retrieved

# Pre-lock calibration (not protocol searches; nothing entered the register).
# PubMed counts and benchmark recall measured 2026-10-27 through E-utilities.
# Benchmark: 151 legacy includes, 139 of them in PubMed (no DOI: 6 book/chapter
# reviews; not in PubMed: 6, four of them Aphasiology papers — PsycINFO/Scopus
# must cover those).
calibration:
  - date: 2026-10-27
    database: pubmed
    draft: first draft (stroke required everywhere; aphasia terms only)
    union_hits: ~11000
    benchmark_found: 105 of 139 (76 %)
    finding: >-
      Two systematic losses. (1) Lesion studies of language that never say
      "aphasia" (alexia, dyslexia/dysgraphia, agrammatic comprehension, verbal
      fluency, speech comprehension). (2) Therapy papers and reviews that say
      "aphasia" but never "stroke". Amended: q1b added; q2a, q2b, q4 no longer
      require the stroke block; focal damage / single-subject / generalisation
      terms added.
  - date: 2026-10-27
    database: pubmed
    draft: this file
    hits: {q1_lesion_impairment: 4682, q1b_language_lesion_mapping: 2847, q2a_therapy_efficacy: 2147,
           q2b_therapy_response_neural: 2583, q3_predictor_outcome: 3957, q4_synthesis: 1967,
           q5_recruitment_meta: 915}
    union_hits: 11859
    benchmark_found: 120 of 139 (86 %)
    missed_probably_out_of_scope: [C0002, C0022, C0098, C0099, C0100, C0116, C0106, C0108, C0141, C0146, C0155, C0157]
    missed_in_scope: [C0012, C0073, C0080, C0104, C0109, C0110, C0126]
    finding: >-
      Excluding the 12 probably out of scope (healthy-volunteer or theoretical
      papers, non-language cognition, dysarthria, VR rehabilitation), recall is
      120/127 (94 %). The 7 in-scope misses: three narrative aphasia reviews
      that never say stroke (C0080, C0104, C0126 — q4 takes narrative reviews
      only with stroke, to stay under ~2,000 hits), a therapy-imaging paper
      without stroke or therapy MeSH (C0012), a lesion study with no population
      term (C0073), a pure-alexia eye-movement study (C0109), and Bates 2003
      VLSM, which has no abstract (C0110). Citation chasing (§3) is the route
      for these.
  - date: 2026-10-27
    database: pubmed
    draft: this file, after the scope decisions of 2026-10-27 (years 2000-, q1c, q4 narrative reviews need stroke + imaging)
    hits_2000_on: {q1_lesion_impairment: 3528, q1b_language_lesion_mapping: 2145, q1c_cognition_prosody_lesion: 1041,
                   q2a_therapy_efficacy: 2014, q2b_therapy_response_neural: 2382, q3_predictor_outcome: 3429,
                   q4_synthesis: 1466, q5_recruitment_meta: 907}
    union_hits: 10281
    benchmark: 139 in PubMed; 3 published before 2000 (C0022, C0047, C0133) → 136 in the window
    benchmark_found: 123 of 136 (90 %)
    missed_out_of_scope: [C0002, C0098, C0099, C0100, C0080, C0104, C0126, C0106, C0108]
    missed_in_scope: [C0012, C0073, C0109, C0110]
    finding: >-
      Out of scope under the 2026-10-27 decisions: a primary healthy-volunteer
      study (C0002), narrative reviews that do not name stroke and neuroimaging
      (C0098, C0099, C0100, C0080, C0104, C0126), dysarthria and VR-rehabilitation
      reviews (C0106, C0108). Recall on in-scope, in-window benchmark papers:
      123/127 (97 %). The 4 in-scope misses and the pre-2000 pillars (Geschwind
      1965, Dronkers 1996, Pedersen 1995, Goldenberg 1994, Nadeau & Crosson 1997,
      Crosson 1999) are candidates for citation chasing.
  - date: 2026-10-27
    database: pubmed
    draft: this file, with dysarthria in scope (aphasia block + "Dysarthria"[Mesh] OR dysarthri*[tiab])
    hits_2000_on: {q1_lesion_impairment: 4465, q1b_language_lesion_mapping: 2145, q1c_cognition_prosody_lesion: 1041,
                   q2a_therapy_efficacy: 2375, q2b_therapy_response_neural: 2864, q3_predictor_outcome: 4037,
                   q4_synthesis: 1703, q5_recruitment_meta: 907}
    union_hits: 11864
    benchmark_found: 124 of 136 in the window (91 %)
    missed_out_of_scope: [C0002, C0098, C0099, C0100, C0080, C0104, C0126, C0108]
    missed_in_scope: [C0012, C0073, C0109, C0110]
    finding: >-
      Dysarthria adds ~1,600 records and finds the dysarthria Cochrane review
      (C0106). In-scope recall 124/128 (97 %). Note that the aphasia block now
      means "aphasia or motor speech disorder"; the gap strategies inherit it.
  - date: 2026-10-27
    database: pubmed
    draft: version 2 (scope A)
    hits_2000_on: {q1_lesion_impairment: 4465, q1b_language_lesion_mapping: 2145, q1c_cognition_prosody_lesion: 1041,
                   q2b_therapy_response_neural: 1387, q3_predictor_outcome: 2041, q4_synthesis: 1704,
                   q5_recruitment_meta: 908}
    union_hits: 8681
    benchmark: 128 benchmark papers that the v1 PubMed runs retrieved
    benchmark_found: 111 of 128
    missed_by_design: [C0010, C0023, C0024, C0036, C0041, C0045, C0048, C0075, C0081, C0082, C0084, C0117, C0135,
                       C0137, C0138, C0142, C0145]
    finding: >-
      The 17 papers v2 no longer retrieves are therapy trials and clinical
      predictor cohorts without imaging; under scope A they are excluded at full
      text (no_imaging_primary) and their evidence comes from the syntheses. A
      stricter imaging block everywhere (7,482 records) would also lose in-scope
      papers (e.g. C0122, C0088), so it is used only for q2b.

