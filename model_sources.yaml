# model_sources.yaml — where each benchmarked model comes from.
#
# Shown on the explorer's Models page (#/models), in each model's "details" block.
# benchmark_models.py --publish copies the entry of every model it scores into
# export/model-benchmark.json; `--refresh-sources` does it without re-running anything.
# When Ollama is reachable, the publish also records what was actually run on this
# machine (`ollama show`: format, quantisation, parameters; `ollama list`: digest).
#
# Curated by hand from the developers' model cards and the Ollama library pages.
# Facts change (licences, tags): re-check and update `checked` when you edit an entry.
# Leave a field out rather than guess.

sourcing: >-
  Every model is downloaded with `ollama pull <tag>` from the Ollama library
  (registry.ollama.ai), which repackages the weights its developer published,
  usually quantised to about 4 bits per weight. It then runs offline through Ollama
  on the maintainer's computer: no paper text leaves the machine, and no account
  with the developer is involved.

models:

  gemma4:31b:
    family: Gemma 4
    developer: Google DeepMind
    released: 2026 (technical report, July 2026)
    licence: Apache 2.0
    licence_url: https://huggingface.co/google/gemma-4-31B-it
    architecture: dense transformer, 30.7 B parameters
    context: 256K tokens
    data_cutoff: January 2025 (pre-training)
    upstream: https://huggingface.co/google/gemma-4-31B-it
    library: https://ollama.com/library/gemma4:31b
    weights: >-
      Ollama's default 31b tag, which holds two 4-bit builds and serves the one that suits
      the machine: an MLX build (19 GB) and a llama.cpp build at Q4_K_M (20 GB), each with a
      small draft model for faster decoding.
    checked: 2026-11-10

  gemma4:31b-it-q8_0:
